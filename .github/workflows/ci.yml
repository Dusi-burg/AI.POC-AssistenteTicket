name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    # Windows because the SQL health tests connect to SQL Server LocalDB,
    # which only exists on Windows. No Zammad and no Ollama: tests use fakes.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The AppHost uses the Aspire CLI bundle (AspireUseCliBundle): its build resolves DCP and the
      # dashboard from the bundle and fails with ASPIRE009 when the aspire command is missing, as on a
      # clean runner. With the CLI on PATH the AppHost build runs 'aspire setup' itself to extract the
      # bundle. Same version as Aspire.AppHost.Sdk (the tool shim is aspire.cmd, so call it by name).
      - name: Install Aspire CLI
        shell: pwsh
        run: |
          dotnet tool install --global Aspire.Cli --version 13.6.1
          $tools = Join-Path $env:USERPROFILE '.dotnet\tools'
          $tools >> $env:GITHUB_PATH
          $env:PATH = "$tools;$env:PATH"
          aspire --version

      # The VECTOR type exists only from SQL Server 2025 (LocalDB 17.x). On an
      # older LocalDB the tests that need it are skipped and stay mandatory locally.
      - name: Start SQL Server LocalDB instance 'localdev'
        id: localdb
        shell: pwsh
        run: |
          $versions = sqllocaldb versions
          $versions
          $major = ($versions | Select-String '\((\d+)\.' | ForEach-Object { [int]$_.Matches[0].Groups[1].Value } | Measure-Object -Maximum).Maximum
          sqllocaldb create localdev -s
          sqllocaldb info localdev
          if ($major -ge 17) {
            "filter=" >> $env:GITHUB_OUTPUT
          } else {
            Write-Output "::warning::LocalDB $major.x has no VECTOR type (SQL Server 2025 required): tests in category RequiresSql2025 skipped."
            "filter=--filter TestCategory!=RequiresSql2025" >> $env:GITHUB_OUTPUT
          }

      - name: Restore
        run: dotnet restore Dusiburg.AI.Ticket.slnx

      - name: Build
        run: dotnet build Dusiburg.AI.Ticket.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution Dusiburg.AI.Ticket.slnx --configuration Release --no-build ${{ steps.localdb.outputs.filter }}
